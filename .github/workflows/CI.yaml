name: 🐋 Docker Publish

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ github.sha }}
  REGISTRY: ghcr.io

jobs:
  build:
    name: ⚙️ Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 👤 Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧲 Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: 🔨 Build Docker image (local test)
        run: |
          docker build -t test-image:latest .

      - name: 🧪 Run container and wait for healthcheck
        run: |
          docker run -d --name test-container -p 9200:9200 test-image:latest
          echo "⏳ Waiting for container to become healthy..."
          for i in {1..10}; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' test-container)
            echo "Healthcheck status: $status"
            if [ "$status" == "\"healthy\"" ]; then
              echo "✅ Container is healthy."
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "❌ Container failed health check."
              docker logs test-container
              exit 1
            fi
            sleep 5
          done

      - name: 🧹 Stop test container
        run: docker rm -f test-container

      - name: 🚀 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
