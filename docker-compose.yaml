version: "3.8"

services:
  whmcs-exporter:
    build: .
    container_name: whmcs-exporter
    ports:
      - ${PORT}:${PORT}
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      - PORT=9200
      - WHMCS_API_URL=${WHMCS_API_URL}
      - WHMCS_IDENTIFIER=${WHMCS_IDENTIFIER}
      - WHMCS_SECRET=${WHMCS_SECRET}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
    healthcheck:
      test: curl --fail http://localhost:${PORT}/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
